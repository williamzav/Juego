<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dragon Game</title>
</head>

<body>
    <div class="container mt-1">
        <img src="../public/img/seleccion/DRAGON.png" style="image-rendering: pixelated; width: 21%;">
        <hr class="text-danger">

        <!-- CONTADOR DE VICTORIAS - Solo visible en batalla -->
        <div class="row mb-4 d-none" id="contador_victorias">
            <div class="col-12">
                <div class="card shadow-lg border-0">
                    <div class="card-body p-0">
                        <div class="row g-0">
                            <!-- Jugador 1 - ROJO -->
                            <div class="col-6 bg-danger text-white p-3 text-center position-relative">
                                <div class="position-absolute top-0 start-50 translate-middle">
                                    <span class="badge bg-dark fs-6 px-3 py-2">🏆 MARCADOR 🏆</span>
                                </div>
                                <h4 class="mb-2 mt-3">🔴 JUGADOR 1</h4>
                                <div class="display-2 fw-bold" id="victorias1">0</div>
                                <p class="mb-0 fs-6 text-uppercase fw-bold">Victorias</p>
                            </div>
                            
                            <!-- Separador central -->
                            <div class="col-auto bg-dark d-flex align-items-center px-1">
                                <div class="vr" style="width: 3px; opacity: 1;"></div>
                            </div>
                            
                            <!-- Jugador 2 - AZUL -->
                            <div class="col bg-primary text-white p-3 text-center">
                                <h4 class="mb-2 mt-3">🔵 JUGADOR 2</h4>
                                <div class="display-2 fw-bold" id="victorias2">0</div>
                                <p class="mb-0 fs-6 text-uppercase fw-bold">Victorias</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- SELECCIÓN DE PERSONAJES -->
        <div class="row justify-content-around" id="seleccion_personajes">
            <div class="col-md-5" id="jugador1">
                <input type="text" id="username_py1" class="form-control mb-3" placeholder="Player 1">
                <div class="row mb-3" id="seleccion_personaje1">
                    <div class="col-3">
                        <button class="btn btn-danger rounded-circle">
                            <img src="./public/img/seleccion/01.png" alt="personaje1" class="img-fluid mt-1 mb-1"
                                title="Veguito">
                        </button>
                    </div>
                    <div class="col-3">
                        <button class="btn btn-danger rounded-circle">
                            <img src="./public/img/seleccion/03.png" alt="personaje2" class="img-fluid mt-1 mb-1"
                                title="Trunks">
                        </button>
                    </div>
                    <div class="col-3">
                        <button class="btn btn-danger rounded-circle">
                            <img src="./public/img/seleccion/05.png" alt="personaje3" class="img-fluid mt-1 mb-1"
                                title="Goku">
                        </button>
                    </div>
                    <div class="col-3">
                        <button class="btn btn-danger rounded-circle">
                            <img src="./public/img/seleccion/06.png" alt="personaje4" class="img-fluid mt-1 mb-1"
                                title="Gohan">
                        </button>
                    </div>
                    <div class="col-3">
                        <button class="btn btn-danger rounded-circle">
                            <img src="./public/img/seleccion/09.png" alt="personaje4" class="img-fluid mt-1 mb-1"
                                title="Moro">
                        </button>
                    </div>
                    
                </div>
                <button id="btn_py1" class="btn btn-danger w-100 mb-3">Aceptar</button>
            </div>
            <div class="col-md-5" id="jugador2">
                <input type="text" id="username_py2" class="form-control mb-3" placeholder="Player 2">
                <div class="row mb-3" id="seleccion_personaje2">
                    <div class="col-3">
                        <button class="btn btn-primary rounded-circle">
                            <img src="./public/img/seleccion/02.png" alt="personaje1" class="img-fluid mt-1 mb-1"
                                title="Veguetta">
                        </button>
                    </div>
                    <div class="col-3">
                        <button class="btn btn-primary rounded-circle">
                            <img src="./public/img/seleccion/04.png" alt="personaje2" class="img-fluid mt-1 mb-1"
                                title="Pikoro">
                        </button>
                    </div>
                    <div class="col-3">
                        <button class="btn btn-primary rounded-circle">
                            <img src="./public/img/seleccion/07.png" alt="personaje3" class="img-fluid mt-1 mb-1"
                                title="Gogueta">
                        </button>
                    </div>
                    <div class="col-3">
                        <button class="btn btn-primary rounded-circle">
                            <img src="./public/img/seleccion/08.png" alt="personaje4" class="img-fluid mt-1 mb-1"
                                title="Cell">
                        </button>
                    </div>
                    <div class="col-3">
                        <button class="btn btn-primary rounded-circle">
                            <img src="./public/img/seleccion/10.png" alt="personaje4" class="img-fluid mt-1 mb-1"
                                title="Black">
                        </button>
                    </div>
                </div>
                <button id="btn_py2" class="btn btn-primary w-100 mb-3">Aceptar</button>
            </div>
        </div>

        <!-- BATALLA -->
        <div class="row justify-content-around d-none" id="batalla">
            <div class="col-md-5">
                <h2 id="nombre_personaje1" ></h2>
                <p id="username1"></p>
                <hr class="text-danger">
                <div class="row">
                    <div class="col-12 mb-3">
                        <div class="progress" aria-label="Vida">
                            <div id="vida1" class="progress-bar bg-success" role="progressbar" style="width: 100%">1000
                            </div>
                        </div>
                    </div>

                    <div class="col-12 mb-3">
                        <div class="progress" aria-label="Energía">
                            <div id="energia1" class="progress-bar bg-primary" role="progressbar" style="width: 100%">
                                1000</div>
                        </div>
                    </div>

                    <div class="col-12 mb-3">
                        <div class="progress" aria-label="Ki">
                            <div id="ki1" class="progress-bar bg-info" role="progressbar" style="width: 100%">1000</div>
                        </div>
                    </div>
                </div>

                <img class="mx-auto d-block" width="40%" id="img_personaje1" src="" alt="">
                <button id="btn_atk_basico1" class="btn btn-danger mb-3">ATK Básico</button>

                <button id="btn_atk_especial1" class="btn btn-purple mb-3">ATK Especial</button>

                <button id="btn_ki1" class="btn btn-warning mb-3">Carga de Ki</button>
                <button id="btn_vida1" class="btn btn-success mb-3">Semilla del Ermitaño</button>
            </div>

            <div class="col-md-2 align-self-center">
                <h2 class="text-center display-3">VS</h2>
            </div>

            <div class="col-md-5">
                <h2 id="nombre_personaje2"></h2>
                <p id="username2"></p>
                <hr class="text-danger">
                <div class="row">

                    <div class="col-12 mb-3">
                        <div class="progress" aria-label="Vida">
                            <div id="vida2" class="progress-bar bg-success" role="progressbar" style="width: 100%">1000
                            </div>
                        </div>
                    </div>

                    <div class="col-12 mb-3">
                        <div class="progress" aria-label="Energía">
                            <div id="energia2" class="progress-bar bg-primary" role="progressbar" style="width: 100%">
                                1000</div>
                        </div>
                    </div>

                    <div class="col-12 mb-3">
                        <div class="progress" aria-label="Ki">
                            <div id="ki2" class="progress-bar bg-info" role="progressbar" style="width: 100%">1000</div>
                        </div>
                    </div>
                </div>

                <img class="mx-auto d-block" width="40%" id="img_personaje2" src="" alt="">
                <button id="btn_atk_basico2" class="btn btn-danger mb-3">ATK Básico</button>
                 <button id="btn_atk_especial2" class="btn btn-purple mb-3">ATK Especial</button>
                <button id="btn_ki2" class="btn btn-warning mb-3">Carga de Ki</button>
                <button id="btn_vida2" class="btn btn-success mb-3">Semilla del Ermitaño</button>
            </div>
        </div>
    </div>

    <script src="./bundle.js"></script>
</body>

</html>
